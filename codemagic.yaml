workflows:
  android:
    name: Shia Namaz APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - signing
      node: 20
      java: 17
    triggering:
      events:
        - push
    scripts:
      - name: Build APK
        script: unzip -o -q shia-namaz-offline.zip -d src && bash src/build.sh
    artifacts:
      - ShiaNamaz.apk
